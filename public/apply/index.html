<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardian Operations · Whitelist Application</title><link rel="stylesheet" href="/portal/portal.css?v=42"><style>body{min-height:100vh}.applyWrap{width:min(900px,92vw);margin:50px auto}.applyCard{background:#091721;border:1px solid #244357;border-radius:12px;padding:30px}.applyBrand{display:flex;gap:15px;align-items:center;margin-bottom:25px}.applyBrand img{width:58px}.applyCard h1{margin:4px 0 8px}.applyCard p{color:#819bab;font-size:12px;line-height:1.6}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;color:#8da6b6;font-size:9px;font-weight:900;letter-spacing:1.1px}input,textarea{width:100%;margin-top:7px;background:#06131c;border:1px solid #2a4a5e;border-radius:6px;padding:12px;color:#fff;font:inherit}textarea{min-height:115px;resize:vertical}.check{display:flex;gap:10px;align-items:center;font-size:11px;color:#a6bbc8}.check input{width:auto;margin:0}.error{color:#f08a93;font-size:11px;margin-top:12px}.success{padding:20px;border:1px solid #286449;background:#09271b;color:#91e2b4;border-radius:8px}@media(max-width:700px){.formGrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="applyWrap"><a class="brand" href="/portal/"><img src="/assets/guardian-projects-shield.png"><span><b>GUARDIAN OPERATIONS</b><small>WHITELIST APPLICATION</small></span></a><div class="applyCard"><div class="eyebrow">MEMBERSHIP & OPERATIONAL ACCESS</div><h1>Apply to join Guardian</h1><p id="intro">Complete the application below. Your MDT, Control and Radio access stays locked until a Guardian administrator approves the application.</p><form id="form"><div class="formGrid"><label>DESIRED USERNAME<input id="username" required autocomplete="username"></label><label>DISPLAY NAME<input id="displayName" required></label><label>DISCORD USERNAME / ID<input id="discord" required></label><label>AGE<input id="age" type="number" min="13" required></label><label class="full">PASSWORD<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><div id="questions" class="full"></div><label class="full check"><input id="rules" type="checkbox" required> I confirm I meet the minimum age and agree to follow the community/server rules.</label></div><button class="btn primary" id="submit" type="submit">SUBMIT WHITELIST APPLICATION</button><a class="btn" href="/portal/">BACK TO PORTAL</a><div id="error" class="error"></div></form><div id="success" class="success hidden"></div></div></div><script>let portal={};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{portal=(await fetch('/api/portal/config',{cache:'no-store'}).then(r=>r.json())).portal||{};document.getElementById('age').min=portal.minimumAge||16;document.getElementById('questions').innerHTML=(portal.applicationQuestions||[]).map((q,i)=>`<label class="full">${esc(q)}<textarea data-answer="${i}" required></textarea></label>`).join('')})();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submit'),err=document.getElementById('error');btn.disabled=true;err.textContent='';try{const answers=[...document.querySelectorAll('[data-answer]')].map(x=>x.value);const r=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,displayName:displayName.value,discord:discord.value,age:Number(age.value),password:password.value,answers,rulesAccepted:rules.checked})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Application failed');document.getElementById('form').classList.add('hidden');const s=document.getElementById('success');s.classList.remove('hidden');s.innerHTML='<b>Application submitted.</b><br>Your Guardian account is now pending approval. Operational systems remain locked until staff approve you.<br><br><a class="btn primary" href="/portal/?status=pending">RETURN TO PORTAL</a>'}catch(ex){err.textContent=ex.message}finally{btn.disabled=false}};</script></body></html>
