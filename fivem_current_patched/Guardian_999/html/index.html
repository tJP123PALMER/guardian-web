<!doctype html><html><head><meta charset="utf-8"><title>Guardian 999</title><link rel="stylesheet" href="style.css"></head><body>
<div class="overlay"><div class="card">
<div class="head"><div><div class="eyebrow">DIRECT TO FIRE CONTROL</div><h1>📞 REPORT AN INCIDENT</h1><p>Your report will be sent directly to Fire Control.</p></div><b class="badge">999</b></div>
<label>Caller Name</label><input id="caller" maxlength="100">
<label>Location / Address</label><input id="location" maxlength="200" placeholder="Where is the emergency?">
<label>What is happening?</label><textarea id="description" maxlength="1000" rows="7" placeholder="Describe the emergency..."></textarea>
<div class="actions"><button id="cancel">CANCEL</button><button id="submit">SEND TO FIRE CONTROL</button></div>
<div class="hint">Your current GPS position is also sent to Control.</div>
</div></div><script src="ui.js?v=2"></script></body></html>
